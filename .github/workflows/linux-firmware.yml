name: Linux firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out doomConsole
        uses: actions/checkout@v5
        with:
          path: workspace/doomConsole

      - name: Check out JaszczurHAL
        uses: actions/checkout@v5
        with:
          repository: jaszczurtd/JaszczurHAL
          path: workspace/libraries/JaszczurHAL

      - name: Install native RP build prerequisites
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            libusb-1.0-0-dev pkg-config python3
          test -f "$(arm-none-eabi-g++ -print-file-name=libstdc++.a)"

      - name: Provision pinned JaszczurHAL components
        working-directory: workspace/libraries/JaszczurHAL
        run: |
          set -eux
          python3 scripts/component_manager.py source-components
          python3 scripts/component_manager.py component picotool --enable

      - name: Build RP2350 ARM firmware
        working-directory: workspace/doomConsole
        run: |
          set -eux
          ../libraries/JaszczurHAL/vscode/entry/jh-vscode build \
            --project "$PWD" --target rp2350-arm --board pico2w

      - name: Build RP2350 ARM debug firmware
        working-directory: workspace/doomConsole
        run: |
          set -eux
          ../libraries/JaszczurHAL/vscode/entry/jh-vscode build-debug \
            --project "$PWD" --target rp2350-arm --board pico2w

      - name: Refresh IntelliSense database
        working-directory: workspace/doomConsole
        run: |
          set -eux
          ../libraries/JaszczurHAL/vscode/entry/jh-vscode refresh-intellisense \
            --project "$PWD" --target rp2350-arm --board pico2w

      - name: Collect firmware artifacts
        working-directory: workspace/doomConsole
        run: |
          set -eux
          mkdir -p .build/ci-artifacts
          cp .build/firmware.elf .build/ci-artifacts/doom-console-rp2350-arm.elf
          cp .build/firmware.uf2 .build/ci-artifacts/doom-console-rp2350-arm.uf2
          cp .build/compile_commands_patched.json .build/ci-artifacts/

      - name: Verify checkout stayed clean
        working-directory: workspace/doomConsole
        run: |
          set -eu
          git diff --exit-code
          unexpected="$(git status --porcelain --untracked-files=all)"
          if [ -n "${unexpected}" ]; then
            printf 'Build left unexpected repository files:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doom-console-linux-rp2350-arm
          path: workspace/doomConsole/.build/ci-artifacts/*
          if-no-files-found: error
